# Release builds of the actp CLI (server and bridge). The tray is built separately
# per platform, because it needs native code on macOS.
version: 2

project_name: actp

before:
  hooks:
    - go mod tidy
    - go generate ./api/

builds:
  - id: actp
    main: ./cmd/actp
    binary: actp
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: actp
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: git
  sort: asc
