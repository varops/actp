name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -count=1 ./...
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build universal desktop binary (tray needs cgo on macOS)
        run: |
          version="${GITHUB_REF_NAME#v}"
          for arch in arm64 amd64; do
            CGO_ENABLED=1 GOARCH=$arch go build -tags tray -trimpath \
              -ldflags "-s -w -X main.version=$version" -o "actp-$arch" ./cmd/actp
          done
          lipo -create -output actp actp-arm64 actp-amd64
          ./actp version
          tar czf "actp-desktop_${version}_darwin_universal.tar.gz" actp LICENSE README.md
          shasum -a 256 "actp-desktop_${version}_darwin_universal.tar.gz" > "actp-desktop_${version}_darwin_universal.tar.gz.sha256"
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" \
            "actp-desktop_${version}_darwin_universal.tar.gz" \
            "actp-desktop_${version}_darwin_universal.tar.gz.sha256" --clobber
