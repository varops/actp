name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...

  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: OpenAPI code is up to date
        run: |
          go generate ./api/
          git diff --exit-code -- api/ || (echo "api/api.gen.go is stale: run 'go generate ./api/' and commit" && exit 1)
      - name: gofmt
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Cross-compile
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/actp
          done

  macos-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build actp.app
        run: packaging/macos/build-app.sh ci
      - name: Check the bundle
        run: |
          test -x dist/actp.app/Contents/MacOS/actp
          lipo -archs dist/actp.app/Contents/MacOS/actp | grep -q arm64
          lipo -archs dist/actp.app/Contents/MacOS/actp | grep -q x86_64
          dist/actp.app/Contents/MacOS/actp version

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: actp:ci
          build-args: VERSION=ci
      - name: Smoke test
        run: |
          token=$(docker run --rm --entrypoint actp actp:ci token generate)
          mkdir -p "$RUNNER_TEMP/ws/site"
          docker run -d --name actp -p 7860:7860 -p 7861:7861 \
            -e ACTP_TUNNEL=off -e ACTP_TOKEN="$token" -e ACTP_ADMIN_PASSWORD=ci-password \
            -e PUID="$(id -u)" -e PGID="$(id -g)" -v "$RUNNER_TEMP/ws:/workspaces" actp:ci
          for i in $(seq 30); do curl -fsS localhost:7860/health && break; sleep 1; done
          curl -fsS -H "Authorization: Bearer $token" localhost:7860/api/v1/info
          curl -fsS localhost:7861/login | grep -q password
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:7861/api/status)" = 401
          docker exec actp grep -q 'path: /workspaces/site' /data/.actp/actp.yaml
          test "$(docker exec actp ps -o user= -C actp)" = node
          docker exec actp cloudflared --version
          docker exec actp bash -lc 'echo $PATH' | grep -q /data/.actp/agents/bin
      - name: Log
        if: always()
        run: docker logs actp || true
