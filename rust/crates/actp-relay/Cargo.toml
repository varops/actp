[package]
name = "actp-relay"
description = "The actp relay: one server that machines dial out to, routing callers to them by device-certificate name"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
actp-proto.workspace = true
base64.workspace = true
bytes.workspace = true
futures-util.workspace = true
hex.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client"] }
hyper-util.workspace = true
percent-encoding.workspace = true
rand.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
socket2 = "0.6"
sha2.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
x509-parser.workspace = true

[dev-dependencies]
actp-client.workspace = true
actp-server = { workspace = true, features = ["testing"] }
rcgen = "0.14"
time = "0.3"
