<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>actp – log in</title>
<style>
:root { --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e4e4df; --accent: #2f5bd3; --bad: #c0392b; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #161615; --panel: #1f1f1d; --text: #ececea; --muted: #9a9a94; --line: #33332f; --accent: #7c9cf5; --bad: #ef6b5b; }
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 16px; }
form { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 24px; width: 100%; max-width: 360px; display: grid; gap: 12px; }
h1 { font-size: 20px; margin: 0; }
p { margin: 0; color: var(--muted); font-size: 14px; }
input { font: inherit; padding: 8px 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); color: var(--text); width: 100%; }
button { font: inherit; border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 7px; padding: 8px 12px; cursor: pointer; }
.error { color: var(--bad); font-size: 14px; min-height: 1.5em; }
</style>
</head>
<body>
<form id="login">
  <h1>actp</h1>
  <p>Enter the dashboard password. It is in <code>ACTP_ADMIN_PASSWORD</code>, or in the container log from its first start.</p>
  <input type="password" name="password" autocomplete="current-password" required autofocus aria-label="Password">
  <button type="submit">Log in</button>
  <div class="error" id="error"></div>
</form>
<script>
document.getElementById("login").onsubmit = async (ev) => {
  ev.preventDefault();
  const err = document.getElementById("error");
  err.textContent = "";
  try {
    const res = await fetch("/login", { method: "POST", headers: { "Content-Type": "application/json", "X-Actp-Dashboard": "1" }, body: JSON.stringify({ password: ev.target.password.value }) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || res.statusText);
    location.href = "/";
  } catch (e) { err.textContent = e.message; }
};
</script>
</body>
</html>
